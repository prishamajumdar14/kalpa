<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KALPA, a narrative game set in an underwater laboratory in the Andaman Sea." />
    <link rel="icon" href="data:," />
    <title>KALPA</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #000;
      }
      /* Portrait keeps the 16:9 framing at the top. The UI fills the space beneath. */
      @media (orientation: portrait) {
        #stage {
          height: 56.25vw;
        }
      }
      #stage canvas,
      #stage video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #stage video {
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
